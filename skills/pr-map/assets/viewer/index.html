<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PR map</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="./"><span class="brand-icon">⌘</span> PR map</a>
      <div class="breadcrumb" id="pr-title"></div>
      <a class="github" id="pr-link" target="_blank" rel="noreferrer"
        >Open in GitHub ↗</a
      >
    </header>
    <div class="app">
      <main>
        <div id="viewport" aria-label="Interactive PR flow map">
          <div id="world">
            <svg id="edges" aria-hidden="true"></svg>
            <div id="nodes"></div>
          </div>
          <div class="map-note">
            Drag to pan · scroll to zoom · click a node to inspect
          </div>
          <div class="zoom-controls">
            <button id="zoom-out" aria-label="Zoom out">−</button
            ><span id="zoom-label">100%</span
            ><button id="zoom-in" aria-label="Zoom in">+</button
            ><button id="fit">Fit ↗</button>
          </div>
        </div>
      </main>
      <aside id="inspector" hidden aria-label="Code inspector">
        <div class="inspector-top">
          <span class="eyebrow">CHANGE INSPECTOR</span>
          <div class="inspector-actions">
            <button
              id="expand-inspector"
              aria-label="Expand code panel"
              title="Expand code panel"
            >
              ⤢</button
            ><button id="close-inspector" aria-label="Close inspector">
              ✕
            </button>
          </div>
        </div>
        <div id="inspector-summary"></div>
        <div id="code-controls"></div>
        <div id="inspector-content"></div>
        <div class="inspector-footer">
          <span id="scope-note"
            >Method-focused source · imports hidden by default</span
          ><a id="source-link" target="_blank" rel="noreferrer">Source ↗</a>
        </div>
      </aside>
    </div>
    <div id="status" role="status" class="sr-only"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
